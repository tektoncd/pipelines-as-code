apiVersion: v1
kind: Secret
metadata:
  name: pipelines-as-code-webhook-certs
  namespace: pipelines-as-code
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/part-of: pipelines-as-code
# The data is populated at install time
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validation.pipelinesascode.tekton.dev
  labels:
    app.kubernetes.io/version: "devel"
    app.kubernetes.io/part-of: pipelines-as-code
webhooks:
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: pipelines-as-code-webhook
        namespace: pipelines-as-code
    failurePolicy: Fail
    sideEffects: None
    name: validation.pipelinesascode.tekton.dev
  # Tekton can start cloning as soon as the API server saves the release.
  - name: queued-token.pipelinesascode.tekton.dev
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: pipelines-as-code-webhook
        namespace: pipelines-as-code
        path: /validate
    failurePolicy: Fail
    sideEffects: NoneOnDryRun
    rules:
      - operations: ["UPDATE"]
        apiGroups: ["tekton.dev"]
        apiVersions: ["v1"]
        resources: ["pipelineruns"]
        scope: Namespaced
    matchConditions:
      - name: release
        expression: >-
          has(oldObject.spec.status) && oldObject.spec.status == "PipelineRunPending" &&
          (!has(object.spec.status) || object.spec.status == "")
      - name: github-app
        expression: >-
          has(oldObject.metadata.annotations) &&
          "pipelinesascode.tekton.dev/installation-id" in oldObject.metadata.annotations &&
          "pipelinesascode.tekton.dev/git-auth-secret" in oldObject.metadata.annotations &&
          !("pipelinesascode.tekton.dev/ghe-url" in oldObject.metadata.annotations)
