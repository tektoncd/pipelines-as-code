coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default: false

ignore:
  # Auto-generated code.
  - "**/zz_generated*.go"
  - "**/*.pb.go"
  - "**/fake/**"
  # Auto-generated client/informer/lister code.
  - "pkg/generated"
  # API type definitions.
  - "pkg/apis"
  # Entry-point binaries.
  - "cmd"
  # Test infrastructure.
  - "test"
  - "pkg/test"
  - "pkg/provider/**/test"
  - "hack"
  - "config"
  - "docs"
  - "vendor"
