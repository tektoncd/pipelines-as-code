---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: paco
  annotations:
    # Shared Paco Pipeline. It tracks paco-cli main, and its image parameter
    # defaults to the matching "latest" image.
    pipelinesascode.tekton.dev/pipeline: "https://raw.githubusercontent.com/pipelines-as-code/paco-cli/main/tekton/paco.pipeline.yaml"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" && (body.action == "opened" || body.action == "reopened")
    pipelinesascode.tekton.dev/on-comment: "^/paco[[:space:]]+(review|summary)[[:space:]]*$"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  pipelineRef:
    name: paco
  params:
    - name: repo_owner
      value: "{{repo_owner}}"
    - name: repo_name
      value: "{{repo_name}}"
    - name: pull_request_number
      value: "{{pull_request_number}}"
    - name: trigger_comment
      value: |
        {{ trigger_comment }}
    # trigger_comment contains the comment text, not its GitHub ID. Read the ID
    # from the original issue_comment webhook; leave it empty for pull_request
    # events.
    - name: comment_id
      value: "{{ cel: has(body.comment) && has(body.comment.id) ? string(int(body.comment.id)) : '' }}"
    - name: git_auth_secret
      value: "{{git_auth_secret}}"
    - name: vertex_project
      value: "itpc-gcp-pnd-pe-eng-claude"
    - name: model
      value: "claude-opus-4-6@default"
    - name: reasoning_effort
      value: "high"
    - name: verify_findings
      value: "true"
  workspaces:
    - name: source
      emptyDir: {}
